name: journey-restore-large-files
on:
  push:
    branches: [cursor/own-journey-66a5]
    paths:
      - '.journey-tmp/**'
      - '.github/workflows/journey-restore-large-files.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/own-journey-66a5
          fetch-depth: 0
      - name: Restore chunked files
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, json, hashlib, pathlib
          root = pathlib.Path('.journey-tmp')
          if not root.exists():
              print('no .journey-tmp; skip')
              raise SystemExit(0)
          changed = False
          for man in sorted(root.glob('*.manifest.json')):
              meta = json.loads(man.read_text())
              parts = []
              incomplete = False
              for i in range(meta['chunks']):
                  p = root / f"{meta['label']}.{i:02d}.b64"
                  if not p.exists():
                      print('incomplete', meta['label'], 'missing', p.name, '- skip')
                      incomplete = True
                      break
                  parts.append(p.read_text().strip())
              if incomplete:
                  continue
              raw = base64.b64decode(''.join(parts))
              dig = hashlib.sha256(raw).hexdigest()
              if dig != meta['sha256']:
                  raise SystemExit(f"sha mismatch for {meta['label']}: {dig} != {meta['sha256']}")
              dest = pathlib.Path(meta['dest'])
              dest.parent.mkdir(parents=True, exist_ok=True)
              if not dest.exists() or dest.read_bytes() != raw:
                  dest.write_bytes(raw)
                  print('wrote', dest, 'bytes', len(raw))
                  changed = True
              else:
                  print('unchanged', dest)
          if changed:
              pathlib.Path('.journey-tmp/RESTORED').write_text('ok\n')
          PY
      - name: Commit restored sources
        run: |
          set -euo pipefail
          if [ ! -f .journey-tmp/RESTORED ]; then
            echo 'nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/furi_hal/furi_hal_nrf24.c components/wifi/wlan_hal.c components/btshim/btshim.c || true
          git add -u components/furi_hal/furi_hal_nrf24.c components/wifi/wlan_hal.c components/btshim/btshim.c || true
          if git diff --cached --quiet; then
            echo 'no staged changes'
            exit 0
          fi
          git commit -m 'journey: restore nrf24/wlan/btshim from chunked MCP sync (PR135+nRF24)'
          git push origin HEAD:cursor/own-journey-66a5
